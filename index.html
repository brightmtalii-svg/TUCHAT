<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Nexus Chat — a fast, real-time WebSocket chat." />
  <meta name="color-scheme" content="dark light" />
  <title>Nexus Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Connection status banner                                          -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <div id="connection-banner" class="connection-banner" role="status" aria-live="polite" hidden>
    <span class="connection-banner__spinner" aria-hidden="true"></span>
    <span id="connection-banner-text">Connecting…</span>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Username gate (modal overlay)                                     -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <div id="username-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="username-title">
    <div class="overlay__card">
      <div class="overlay__brand" aria-hidden="true">💬</div>
      <h1 id="username-title" class="overlay__title">Nexus Chat</h1>
      <p class="overlay__subtitle">Pick a display name to enter the room.</p>

      <form id="username-form" class="overlay__form" novalidate>
        <label for="username-input" class="sr-only">Display name</label>
        <input
          id="username-input"
          class="input"
          type="text"
          name="username"
          placeholder="e.g. Ada Lovelace"
          autocomplete="nickname"
          autocapitalize="words"
          spellcheck="false"
          minlength="2"
          maxlength="24"
          required
        />
        <button id="username-submit" class="btn btn--primary" type="submit" disabled>
          Enter Chat
        </button>
        <p id="username-error" class="form-error" role="alert" aria-live="assertive"></p>
      </form>

      <p class="overlay__hint">
        2–24 characters · letters, digits, spaces, <code>. _ -</code>
      </p>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <!--  Main application shell                                            -->
  <!-- ═══════════════════════════════════════════════════════════════════ -->
  <div id="app" class="app" hidden>
    <!-- Header ---------------------------------------------------------- -->
    <header class="app__header">
      <button
        id="sidebar-toggle"
        class="icon-btn app__header-btn"
        type="button"
        aria-label="Toggle participant list"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="app__identity">
        <span class="app__logo" aria-hidden="true">💬</span>
        <div class="app__identity-text">
          <h1 class="app__title">Nexus Chat</h1>
          <p class="app__subtitle">
            <span id="presence-count" class="presence-count">0 online</span>
          </p>
        </div>
      </div>

      <button
        id="theme-toggle"
        class="icon-btn app__header-btn"
        type="button"
        aria-label="Toggle colour theme"
      >
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <!-- Body ------------------------------------------------------------ -->
    <div class="app__body">
      <!-- Sidebar: participants --------------------------------------- -->
      <aside id="sidebar" class="sidebar" aria-label="Participants">
        <div class="sidebar__header">
          <h2 class="sidebar__title">Online</h2>
          <span id="sidebar-count" class="badge">0</span>
          <button
            id="sidebar-close"
            class="icon-btn sidebar__close"
            type="button"
            aria-label="Close participant list"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <ul id="user-list" class="user-list" role="list"></ul>
      </aside>

      <!-- Backdrop for mobile sidebar --------------------------------- -->
      <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

      <!-- Main chat column -------------------------------------------- -->
      <main class="chat">
        <!-- Message log ------------------------------------------------ -->
        <section
          id="message-log"
          class="message-log"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
          aria-label="Chat messages"
        >
          <div id="message-list" class="message-list"></div>
        </section>

        <!-- Scroll-to-bottom ------------------------------------------- -->
        <button
          id="scroll-bottom"
          class="scroll-bottom"
          type="button"
          aria-label="Scroll to latest messages"
          hidden
        >
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="scroll-bottom-badge" class="scroll-bottom__badge" hidden>0</span>
        </button>

        <!-- Typing indicator ------------------------------------------- -->
        <div id="typing-indicator" class="typing-indicator" hidden>
          <span class="typing-indicator__dots" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span id="typing-indicator-text"></span>
        </div>

        <!-- Composer ---------------------------------------------------- -->
        <form id="composer" class="composer" autocomplete="off">
          <label for="message-input" class="sr-only">Message</label>
          <textarea
            id="message-input"
            class="composer__input"
            name="message"
            placeholder="Type a message…"
            rows="1"
            maxlength="2000"
            spellcheck="true"
            required
          ></textarea>

          <div class="composer__meta">
            <span id="char-counter" class="char-counter" aria-live="polite">0 / 2000</span>
          </div>

          <button id="send-button" class="btn btn--send" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2Z"
                    fill="currentColor"/>
            </svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
